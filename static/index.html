<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freelance Career Intelligence</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #e4e4e7;
    --text-dim: #8b8d98;
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --user-bg: #1e293b;
    --agent-bg: #1a1d27;
    --green: #22c55e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  header h1 span { color: var(--accent); }

  .stats {
    display: flex;
    gap: 20px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .stats .stat-val { color: var(--green); font-weight: 600; }

  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .welcome {
    text-align: center;
    padding: 40px 20px;
    max-width: 600px;
    margin: auto;
  }

  .welcome h2 {
    font-size: 24px;
    margin-bottom: 12px;
    font-weight: 600;
  }

  .welcome p {
    color: var(--text-dim);
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .suggestions button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .suggestions button:hover {
    border-color: var(--accent);
  }

  .message {
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    padding: 16px 20px;
    border-radius: 12px;
    line-height: 1.7;
    font-size: 14px;
  }

  .message.user {
    background: var(--user-bg);
    border: 1px solid var(--border);
  }

  .message.agent {
    background: var(--agent-bg);
    border: 1px solid var(--border);
  }

  .message .role {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
    color: var(--text-dim);
  }

  .message.user .role { color: var(--accent); }
  .message.agent .role { color: var(--green); }

  .message h1, .message h2, .message h3 {
    margin-top: 16px;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .message h1 { font-size: 18px; }
  .message h2 { font-size: 16px; }
  .message h3 { font-size: 14px; }
  .message p { margin-bottom: 8px; }
  .message ul, .message ol { padding-left: 20px; margin-bottom: 8px; }
  .message li { margin-bottom: 4px; }
  .message strong { color: #fff; }
  .message code {
    background: rgba(99, 102, 241, 0.15);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  .message pre {
    background: rgba(99, 102, 241, 0.1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .message pre code {
    background: none;
    padding: 0;
    font-size: 13px;
    white-space: pre;
  }
  .message a {
    color: var(--accent-hover);
    text-decoration: underline;
  }
  .message a:hover {
    color: #a5b4fc;
  }

  .message table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 13px;
    overflow-x: auto;
    display: block;
  }
  .message th, .message td {
    padding: 8px 12px;
    border: 1px solid var(--border);
    text-align: left;
  }
  .message th {
    background: rgba(99, 102, 241, 0.1);
    font-weight: 600;
  }

  .typing {
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    padding: 16px 20px;
    color: var(--text-dim);
    font-size: 14px;
    display: none;
  }

  .typing.active { display: block; }

  .typing::after {
    content: '';
    animation: dots 1.5s steps(4) infinite;
  }

  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
  }

  #input-area {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  #input-form {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }

  #input-form input {
    flex: 1;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  #input-form input:focus {
    border-color: var(--accent);
  }

  #input-form input::placeholder {
    color: var(--text-dim);
  }

  #input-form button {
    padding: 12px 24px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  #input-form button:hover { background: var(--accent-hover); }
  #input-form button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1><span>&#9670;</span> Freelance Career Intelligence</h1>
  <div class="stats" id="stats"></div>
</header>

<div id="chat-container">
  <div class="welcome" id="welcome">
    <h2>What should you learn to freelance?</h2>
    <p>Ask me anything about freelance skills, niches, and opportunities. I analyze both sides of the market — what freelancers offer (1K+ Fiverr gigs) and what clients hire for (88K+ Upwork jobs).</p>
    <div class="suggestions">
      <button onclick="askSuggestion(this)">Best skills for beginners?</button>
      <button onclick="askSuggestion(this)">Where is demand higher than supply?</button>
      <button onclick="askSuggestion(this)">Is Python freelancing worth it?</button>
      <button onclick="askSuggestion(this)">What do clients actually pay?</button>
    </div>
  </div>
</div>

<div class="typing" id="typing">Thinking</div>

<div id="input-area">
  <form id="input-form" onsubmit="sendMessage(event)">
    <input type="text" id="user-input" placeholder="Ask about skills, niches, opportunities..." autocomplete="off">
    <button type="submit" id="send-btn">Send</button>
  </form>
</div>

<script>
const sessionId = (typeof crypto !== 'undefined' && crypto.randomUUID)
  ? crypto.randomUUID()
  : 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
const chatContainer = document.getElementById('chat-container');
const typing = document.getElementById('typing');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const welcome = document.getElementById('welcome');

fetch('/api/stats')
  .then(r => r.json())
  .then(data => {
    if (data.error) {
      document.getElementById('stats').innerHTML = '<span style="color:#f87171">Stats unavailable</span>';
      return;
    }
    const total = (data.total_gigs || 0) + (data.upwork_total || 0);
    document.getElementById('stats').innerHTML =
      `<span><span class="stat-val">${total.toLocaleString()}</span> listings</span>` +
      `<span>Supply: <span class="stat-val">${(data.total_gigs || 0).toLocaleString()}</span> gigs</span>` +
      `<span>Demand: <span class="stat-val">${(data.upwork_total || 0).toLocaleString()}</span> jobs</span>`;
  })
  .catch(() => {
    document.getElementById('stats').innerHTML = '<span style="color:#f87171">Stats unavailable</span>';
  });

function askSuggestion(btn) {
  userInput.value = btn.textContent;
  sendMessage(new Event('submit'));
}

async function sendMessage(e) {
  e.preventDefault();
  const msg = userInput.value.trim();
  if (!msg) return;

  if (welcome) welcome.remove();

  addMessage(msg, 'user');
  userInput.value = '';
  sendBtn.disabled = true;
  typing.classList.add('active');
  chatContainer.scrollTop = chatContainer.scrollHeight;

  try {
    // Without a deadline a stalled request leaves the input disabled with no
    // way back — the browser applies no default fetch timeout.
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, session_id: sessionId }),
      signal: AbortSignal.timeout(120000),
    });
    let data;
    try {
      data = await res.json();
    } catch {
      throw new Error('Server error (' + res.status + ')');
    }
    if (data.error) {
      addMessage('Error: ' + data.error, 'agent');
    } else {
      addMessage(data.response, 'agent');
    }
  } catch (err) {
    addMessage(err.name === 'TimeoutError'
      ? 'Request timed out after 2 minutes. Please try again.'
      : 'Connection error: ' + err.message, 'agent');
  }

  typing.classList.remove('active');
  sendBtn.disabled = false;
  userInput.focus();
}

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const label = role === 'user' ? 'You' : 'Agent';
  div.innerHTML = `<div class="role">${label}</div><div class="content">${role === 'agent' ? renderMarkdown(text) : escapeHtml(text)}</div>`;
  chatContainer.appendChild(div);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function renderMarkdown(text) {
  // Strip NULs so the placeholder sentinels below cannot be forged by an
  // answer that happens to contain the placeholder text literally.
  text = text.replace(/\u0000/g, '');

  // Escape HTML entities first to prevent XSS
  text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // Fenced code blocks — extract first to protect from all formatting
  const codeBlocks = [];
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    codeBlocks.push('<pre><code>' + code + '</code></pre>');
    return '\n\n\u0000C' + (codeBlocks.length - 1) + '\u0000\n\n';
  });

  // Inline code — extract to placeholders to protect from bold/italic
  const inlineCode = [];
  text = text.replace(/`([^`]+)`/g, (_, code) => {
    inlineCode.push('<code>' + code + '</code>');
    return '\u0000I' + (inlineCode.length - 1) + '\u0000';
  });

  // Tables
  text = text.replace(/^\|(.+)\|\n\|[-| :]+\|\n((?:\|.+\|\n?)*)/gm, (match, header, body) => {
    const ths = header.split('|').map(h => `<th>${h.trim()}</th>`).join('');
    const rows = body.trim().split('\n').map(row => {
      const tds = row.split('|').slice(1, -1).map(c => `<td>${c.trim()}</td>`).join('');
      return `<tr>${tds}</tr>`;
    }).join('');
    return `<table><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table>`;
  });

  // Ordered lists (before bold/italic to prevent * conflicts)
  text = text.replace(/^\d+\. (.+)$/gm, '<oli>$1</oli>');
  text = text.replace(/((?:<oli>.+<\/oli>\n?)+)/g, (m) => '<ol>' + m.replace(/<\/?oli>/g, (t) => t.replace('oli', 'li')) + '</ol>');

  // Unordered lists (before bold/italic to prevent * conflicts)
  text = text.replace(/^[*-] (.+)$/gm, '<uli>$1</uli>');
  text = text.replace(/((?:<uli>.+<\/uli>\n?)+)/g, (m) => '<ul>' + m.replace(/<\/?uli>/g, (t) => t.replace('uli', 'li')) + '</ul>');

  // Headers
  text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // Bold and italic
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/(?<!\w)\*(.+?)\*(?!\w)/g, '<em>$1</em>');

  // Restore inline code from placeholders
  text = text.replace(/\u0000I(\d+)\u0000/g, (m, i) => inlineCode[parseInt(i)] ?? m);

  // Links (only allow http/https URLs, sanitize href to prevent attribute injection)
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)"]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // Paragraphs
  text = text.replace(/\n\n/g, '</p><p>');
  text = '<p>' + text + '</p>';
  text = text.replace(/<p>\s*(<h[123]>)/g, '$1');
  text = text.replace(/(<\/h[123]>)\s*<\/p>/g, '$1');
  text = text.replace(/<p>\s*(<ul>)/g, '$1');
  text = text.replace(/(<\/ul>)\s*<\/p>/g, '$1');
  text = text.replace(/<p>\s*(<ol>)/g, '$1');
  text = text.replace(/(<\/ol>)\s*<\/p>/g, '$1');
  text = text.replace(/<p>\s*(<table>)/g, '$1');
  text = text.replace(/(<\/table>)\s*<\/p>/g, '$1');
  text = text.replace(/<p>\s*<\/p>/g, '');

  // Restore code blocks from placeholders, then clean <p> wrapping around <pre>
  text = text.replace(/\u0000C(\d+)\u0000/g, (m, i) => codeBlocks[parseInt(i)] ?? m);
  text = text.replace(/<p>\s*(<pre>)/g, '$1');
  text = text.replace(/(<\/pre>)\s*<\/p>/g, '$1');

  return text;
}
</script>

</body>
</html>
